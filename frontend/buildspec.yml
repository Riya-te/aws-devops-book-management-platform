version: 0.2

env:
  variables:
    VITE_API_URL: "/api"
phases:
  install:
    runtime-versions:
      nodejs: 20  # Specify the Node.js version
    commands:
      - echo Navigating to the frontend directory...
      - cd frontend
      - echo Installing dependencies...
      - npm install
  pre_build:
    commands:
      - echo "Creating .env file in frontend directory..."
      - echo "VITE_API_URL='$VITE_API_URL'" > .env
      - echo "Environment variables have been saved to .env"
  build:
    commands:
      - echo Building the React app...
      - npm run build
post_build:
  commands:
    - echo "Build completed. Deploying frontend using AWS Systems Manager"

    - aws ssm send-command --document-name AWS-RunShellScript --targets Key=tag:Role,Values=WebTier --parameters commands="sudo dnf install -y git nodejs && cd /home/ec2-user && rm -rf aws-devops-book-management-platform && git clone https://github.com/Riya-te/aws-devops-book-management-platform.git && cd aws-devops-book-management-platform/frontend && npm install && npm run build && sudo rm -rf /usr/share/nginx/html/* && sudo cp -r dist/* /usr/share/nginx/html/ && sudo systemctl restart nginx" --region ap-south-1

    - echo "Frontend deployment command sent successfully"
artifacts:
  files:
    - '**/*'
  base-directory: frontend/dist
  discard-paths: no
cache:
  paths:
    - frontend/node_modules/**/*  # Caches node_modules for the frontend app to speed up future builds
